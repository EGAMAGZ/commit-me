name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión de la release (semver, ej. 1.2.3)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-data:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve version
        id: version
        run: echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"

  build:
    needs: build-data
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python 3.12 with uv
        run: |
          uv python install 3.12
          uv python pin 3.12

      - name: Update project version
        if: github.event_name == 'workflow_dispatch'
        run: |
          uv version "${{ inputs.version }}"

      - name: Update version from release tag
        if: github.event_name == 'release'
        run: |
          uv version "${GITHUB_REF_NAME#v}"

      - name: Install dependencies
        run: uv sync --locked --no-install-project --no-dev --no-group test

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: uv publish

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-data.outputs.version }}
          name: "Release build - ${{ needs.build-data.outputs.version }}"
          generate_release_notes: true
          make_latest: true
