[project]
name = "commit-me"
version = "0.5.0"
description = "Generate Conventional Commit messages for your staged changes with opencode and commit them in one step."
keywords = [
    "ai",
    "cli",
    "commit",
    "commit-message",
    "conventional-commits",
    "git",
    "llm",
    "opencode",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Version Control :: Git",
]
authors = [
    { name = "Gamaliel Garcia", email = "46827955+EGAMAGZ@users.noreply.github.com" }
]

maintainers = [
    { name = "Gamaliel Garcia", email = "46827955+EGAMAGZ@users.noreply.github.com" }
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "click>=8.5.0",
    "opencode-py>=0.8.0",
    "rich>=15.0.0",
    "rich-click>=1.9.9",
]

[project.urls]
Homepage = "https://github.com/EGAMAGZ/commit-me"
Repository = "https://github.com/EGAMAGZ/commit-me"

[dependency-groups]
dev = [
    "ruff>=0.16.7",
    "ty>=0.0.80",
]
test = [
    "pytest>=9.1.1",
]

[project.scripts]
commit-me = "commit_me.cli:commit_me_cli"


[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py312"

exclude = [".git", "__pycache__", "styles", ".vscode", ".github"]

[tool.ruff.lint]
select = [
	"F",
	"E",
	"W",
	"N",
	"UP",
	"ANN",
	"BLE",
	"A",
	"COM",
	"C4",
	"DTZ",
	"Q",
	"SLF",
	"SIM",
	"PTH",
	"I",
]
ignore = ["COM812"]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
skip-magic-trailing-comma = false
line-ending = "auto"
